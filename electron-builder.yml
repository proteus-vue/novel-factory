# 小说工厂 · 桌面工作站打包配置（electron-builder）
appId: cn.kags.novelfactory.desktop
productName: 小说工厂
copyright: Copyright © 2026 novel-factory contributors

# Electron 二进制下载镜像（国内网络；构建时也可用 ELECTRON_MIRROR 覆盖）
electronDownload:
  mirror: "https://npmmirror.com/mirrors/electron/"

# 仅打包运行所需：编译产物、Electron 壳、控制台、大禹 MCP；源码/test/android 等不入库
files:
  - dist/**/*
  - desktop/**/*
  - src/console/**/*
  - node_modules/**/*
  - package.json
  - "!desktop/icons/**"
  - "!**/*.map"

# 大禹 MCP 用 import.meta.url 读取同目录 rules.yaml/prompts.md，需真实文件路径；
# node 子进程以 ELECTRON_RUN_AS_NODE 运行，unpack 到 app.asar.unpacked 最稳妥
# 关键点：node 子进程（ELECTRON_RUN_AS_NODE）不认 asar 协议，
# 凡是被它直接读取/执行的 js 与配置，必须解包到 app.asar.unpacked 成为真实文件。
asarUnpack:
  - dist/**
  - desktop/mcp/**
  - src/console/**
  - node_modules/js-yaml/**
  - node_modules/@modelcontextprotocol/**
  - node_modules/zod/**
  - node_modules/argparse/**


# 生产依赖随包（electron-builder 自动带上 dependencies；devDependencies 不含）
npmRebuild: false

directories:
  output: release-desktop
  buildResources: desktop/icons

# ---------- Windows ----------
win:
  icon: desktop/icons/icon.ico
  artifactName: "小说工厂-Setup-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 小说工厂
  language: "2052"          # 简体中文
  installerLanguages:
    - zh_CN
    - en_US

# ---------- Linux ----------
linux:
  icon: desktop/icons
  category: Office
  artifactName: "novel-factory-${version}-${arch}.${ext}"
  target:
    - AppImage
    - deb

# ---------- macOS（未在 Mac 上签名/公证，安装需右键打开或 xattr -cr）----------
mac:
  icon: desktop/icons/icon.icns
  artifactName: "小说工厂-${version}-${arch}.${ext}"
  category: public.app-category.productivity
  target:
    - dmg
    - zip
dmg:
  # 用纯色背景，避免 Linux 交叉编译时调用 macOS 专有的 sips 生成背景图
  backgroundColor: "#f4f7f6"
  window:
    width: 560
    height: 380

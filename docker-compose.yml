# 一键部署：在三个项目的父目录（/workspace）执行：
#   docker compose -f novel-factory/docker-compose.yml up -d --build
# 构建上下文是父目录，因为镜像要同时打包 novel-factory + novel-cda-mcp + novel-review-mcp

services:
  novel-factory:
    build:
      context: ..
      dockerfile: novel-factory/Dockerfile
    image: novel-factory:latest
    container_name: novel-factory
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    environment:
      NOVEL_FACTORY_DATA: /app/data
      NOVEL_LLM_BASE_URL: ${NOVEL_LLM_BASE_URL:-}
      NOVEL_LLM_API_KEY: ${NOVEL_LLM_API_KEY:-}
      NOVEL_LLM_MODEL: ${NOVEL_LLM_MODEL:-gpt-4o-mini}
      PORT: 8787
      HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8787/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
